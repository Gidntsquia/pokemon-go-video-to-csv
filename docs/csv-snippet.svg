<svg xmlns="http://www.w3.org/2000/svg" width="480" height="288" viewBox="0 0 480 288" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="480" height="288" rx="10" fill="#0d1117"/>
  <rect width="480" height="40" rx="10" fill="#161b22"/>
  <rect y="30" width="480" height="10" fill="#161b22"/>
  <circle cx="22" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="20" r="6" fill="#27c93f"/>
  <text x="240" y="25" text-anchor="middle" font-size="13" fill="#8b949e">out/scanned.csv</text>

  <g font-size="14">
